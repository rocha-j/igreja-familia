<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Igreja Família</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so it serves this file for
      // any unknown path. We encode the real path into a query string and
      // redirect to index.html, where a matching script restores it before
      // React Router reads the URL. pathSegmentsToKeep=1 preserves the
      // "/igreja-familia" repo segment that GitHub Pages project sites live under.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
